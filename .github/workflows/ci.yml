name: Al-La'eeb CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: allaeeb

jobs:
  test-auth:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools<81'
          python -m pip install -r backend/services/auth-service/requirements.txt
          python -m pip install pytest pytest-asyncio httpx
      - name: Run auth tests
        run: pytest app/tests -v
        working-directory: backend/services/auth-service
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/services/auth-service:${{ github.workspace }}/backend
          REDIS_HOST: localhost
          SECRET_KEY: ci-only-test-secret-change-me

  test-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools<81' wheel
          python -m pip install --no-build-isolation -r backend/services/ai-engine/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run AI tests
        run: pytest app/tests -v
        working-directory: backend/services/ai-engine
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/services/ai-engine:${{ github.workspace }}/backend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install black flake8 mypy isort
      - name: Compile Python sources
        run: python -m compileall -q backend/
      - name: Check formatting with black
        continue-on-error: true
        run: black --check backend/
      - name: Check imports with isort
        continue-on-error: true
        run: isort --check-only backend/
      - name: Block critical flake8 errors
        run: flake8 backend/ --select=E9,F63,F7,F82 --max-line-length=120
      - name: Report non-blocking style findings
        continue-on-error: true
        run: flake8 backend/ --max-line-length=120
